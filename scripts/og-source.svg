<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121210"/>
      <stop offset="1" stop-color="#0a0a09"/>
    </linearGradient>
    <linearGradient id="accentline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3908"/>
      <stop offset="1" stop-color="#ff3908" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ff3908" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff3908" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- left content -->
  <g transform="translate(88,120)">
    <!-- mark -->
    <g>
      <rect width="64" height="64" rx="13" fill="#e9e7e1"/>
      <path d="m23.1 48 1.4-6.2 10.5-10.1-5.9 2-5.5 2.8-4.4-4.8 10-10.1-.2-6.4 6.9 4.4c7.8 1.8 11 7.8 11 15.1V48Z" fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="32" cy="26.5" r="1.6" fill="#171717"/>
    </g>
    <text x="84" y="30" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#efeeea" letter-spacing="0.3">Quiet Square</text>
    <text x="84" y="57" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#aaa9a3" letter-spacing="0.2">chess.advay.ca</text>

    <!-- headline -->
    <text x="0" y="168" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#efeeea" letter-spacing="-1">Infinite game review,</text>
    <text x="0" y="240" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1"><tspan fill="#efeeea">best moves</tspan><tspan fill="#aaa9a3" dx="18">in</tspan><tspan fill="#ff3908" dx="18">any</tspan><tspan fill="#efeeea" dx="18">spot.</tspan></text>

    <rect x="2" y="282" width="120" height="5" rx="2.5" fill="url(#accentline)"/>

    <!-- tagline -->
    <text x="0" y="340" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#c9c7c1">Near-instant (&lt;1s) move classification, then Stockfish</text>
    <text x="0" y="378" font-family="Instrument Sans, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#c9c7c1">surfaces the next best lines. Screenshot, FEN, or PGN.</text>
  </g>

